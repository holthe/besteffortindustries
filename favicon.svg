<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" shape-rendering="crispEdges">
  <title>Best Effort Industries</title>
  <rect width="64" height="64" fill="#000000"/>
  <g fill="#ffffff">
    <!-- B: crossbar above centre, lower bowl wider than upper -->
    <rect x="10" y="16" width="6"  height="32"/>
    <rect x="10" y="16" width="18" height="6"/>
    <rect x="10" y="27" width="20" height="6"/>
    <rect x="10" y="42" width="20" height="6"/>
    <rect x="22" y="16" width="6"  height="17"/>
    <rect x="24" y="27" width="6"  height="21"/>
    <!-- E: middle arm short, as it should be -->
    <rect x="38" y="16" width="6"  height="32"/>
    <rect x="38" y="16" width="16" height="6"/>
    <rect x="38" y="27" width="13" height="6"/>
    <rect x="38" y="42" width="16" height="6"/>
  </g>
</svg>

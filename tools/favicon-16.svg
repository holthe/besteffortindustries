<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" shape-rendering="crispEdges">
  <!--
    16px variant of favicon.svg, drawn on the pixel grid so the tab icon
    rasterises with hard edges instead of grey mush. Same letterforms,
    fewer pixels to say them in. Keep in sync with favicon.svg by eye.
  -->
  <title>Best Effort Industries</title>
  <rect width="16" height="16" fill="#000000"/>
  <g fill="#ffffff">
    <!-- B -->
    <rect x="1" y="3"  width="2" height="10"/>
    <rect x="1" y="3"  width="5" height="2"/>
    <rect x="1" y="7"  width="6" height="2"/>
    <rect x="1" y="11" width="6" height="2"/>
    <rect x="4" y="3"  width="2" height="6"/>
    <rect x="5" y="7"  width="2" height="6"/>
    <!-- E -->
    <rect x="9" y="3"  width="2" height="10"/>
    <rect x="9" y="3"  width="6" height="2"/>
    <rect x="9" y="7"  width="5" height="2"/>
    <rect x="9" y="11" width="6" height="2"/>
  </g>
</svg>

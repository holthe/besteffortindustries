<!DOCTYPE html>
<!--
  Source for /og.png (1200x630). Rendered by `make og`.
  Edit the copy here, not the PNG. Regenerate after any tagline change.

<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    background: #ffffff;
    color: #000000;
    font-family: "Courier New", Courier, monospace;
    padding: 32px;
  }
  .sheet {
    width: 100%; height: 100%;
    border: 3px solid #000000;
    display: flex; flex-direction: column;
  }
  .doc-head {
    border-bottom: 3px solid #000000;
    padding: 18px 40px;
    display: flex; justify-content: space-between;
    font-size: 20px; text-transform: uppercase; letter-spacing: 0.08em;
  }
  .mid {
    flex: 1;
    padding: 0 40px;
    display: flex; flex-direction: column; justify-content: center;
  }
  .mid h1 {
    font-size: 92px;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    line-height: 1.04;
  }
  .mid .tagline {
    margin-top: 28px;
    font-size: 24px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .mid .tagline b { background: #000000; color: #ffffff; padding: 2px 10px; }
  .foot {
    border-top: 3px solid #000000;
    padding: 18px 40px;
    display: flex; justify-content: space-between;
    font-size: 19px; color: #555555;
    text-transform: uppercase; letter-spacing: 0.06em;
  }
</style>
</head>
<body>
  <div class="sheet">
    <div class="doc-head">
      <span>DOC: BEI-000</span>
      <span>REV: FINAL</span>
    </div>
    <div class="mid">
      <h1>Best Effort<br>Industries</h1>
      <p class="tagline">A diversified portfolio of <b>regrettable technology</b></p>
    </div>
    <div class="foot">
      <span>besteffortindustries.com</span>
      <span>Warranties: none considered</span>
    </div>
  </div>
</body>
</html>
